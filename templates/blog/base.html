<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOG // NEXUS</title>
    <style>
        :root {
            --bg-body: #0a0c10;
            --bg-panel: #12151e;
            --bg-input: #1a1e29;
            --accent-main: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --accent-purple: #7f53ac;
            --text-heading: #ffffff;
            --text-body: #a0aec0;
            --text-dim: #64748b;
            --border-color: rgba(255, 255, 255, 0.06);
            --border-active: rgba(0, 242, 254, 0.4);
            --radius-md: 12px;
            --radius-lg: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-body);
            min-height: 100vh;
            line-height: 1.6;
            padding-top: 80px; /* Відступ під фіксовану шапку */
        }

        header {
            background: rgba(18, 21, 30, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 32px;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-body);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--accent-main);
        }

        /* Контейнер */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 32px;
        }

        .card {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 36px;
            margin-bottom: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 22px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.25s ease;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.25);
        }

        .btn-primary:hover {
            opacity: 0.9;
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-heading);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text-body);
        }

        /* Глобальні стилі форм без білих квадратів */
        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="url"],
        input[type="number"],
        input[type="file"],
        select,
        textarea {
            width: 100% !important;
            background: var(--bg-input) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: var(--radius-md) !important;
            padding: 14px 18px !important;
            color: var(--text-heading) !important;
            font-size: 0.95rem !important;
            outline: none !important;
            box-sizing: border-box !important;
            display: block !important;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-main) !important;
            box-shadow: 0 0 0 4px rgba(0, 242, 254, 0.1) !important;
            background: #1e2330 !important;
        }

        select[multiple] {
            width: 100% !important;
            background: var(--bg-input) !important;
            border: 1px solid var(--border-color) !important;
            padding: 10px !important;
            height: auto !important;
            min-height: 130px !important;
        }

        select[multiple] option {
            background: var(--bg-panel) !important;
            color: var(--text-heading) !important;
            padding: 8px 12px !important;
            margin-bottom: 4px !important;
            border-radius: 6px !important;
        }

        select[multiple] option:checked {
            background: rgba(0, 242, 254, 0.2) !important;
            color: var(--accent-main) !important;
            font-weight: 600 !important;
        }

        input[type="file"] {
            padding: 10px !important;
            color: var(--text-body) !important;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            color: var(--text-heading);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 15px;
            transition: all 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            border-color: var(--accent-main);
            color: var(--accent-main);
        }

        h1, h2, h3 {
            color: var(--text-heading);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-body);
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="{% url 'blog:post_list' %}" class="logo">BLOG<span>//NEXUS</span></a>
            <ul class="nav-links">
                <li><a href="{% url 'blog:post_list' %}">Main</a></li>
                <a href="{% url 'blog:about' %}" style="color: var(--text-body); font-weight: 600; text-decoration: none; transition: color 0.2s;">About Us</a>
                {% if user.is_authenticated %}
                {% if user.is_staff %}
                        <li><a href="{% url 'admin:index' %}" class="btn btn-outline" style="padding: 6px 14px; font-size: 0.85rem; border-color: var(--accent-main); color: var(--accent-main);">Admin Panel</a></li>
                    {% endif %}
                    <li><span style="color: var(--accent-main);">{{ user.username }}</span></li>
                    <li><a href="{% url 'blog:post_create' %}" class="btn btn-primary" style="padding: 6px 14px; font-size: 0.85rem; color:#000;">+ Create</a></li>
                    <li>
                        <form action="{% url 'accounts:logout' %}" method="post" style="display:inline;">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline" style="padding: 6px 12px; font-size: 0.85rem;">Logouta</button>
                        </form>
                    </li>
                {% else %}
                    <li><a href="{% url 'accounts:login' %}">Log in</a></li>
                    <li><a href="{% url 'accounts:register' %}" class="btn btn-primary" style="padding: 6px 14px; font-size: 0.85rem; color:#000;">Register</a></li>
                {% endif %}
            </ul>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
